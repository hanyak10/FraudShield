server:
  port: 8080

fraudshield:
  mock:
    enabled: false

spring:
  application:
    name: fraudshield-backend
  cloud:
    discovery:
      enabled: ${EUREKA_ENABLED:true}
  datasource:
    url: jdbc:h2:mem:fraudshield;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Register this backend with the Eureka server (start Eureka first on :8761).
# Set EUREKA_ENABLED=false to run the backend standalone without discovery.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# JWT configuration. The default secret below is for DEV ONLY (>= 256 bits / 32 chars).
# Override jwt.secret with a real secret in any non-dev environment.
jwt:
  secret: "fraudshield-dev-secret-key-change-me-0123456789-abcdefghijklmnop"
  access-ttl-ms: 900000
  refresh-ttl-ms: 604800000

logging:
  level:
    org.springframework.security: INFO
