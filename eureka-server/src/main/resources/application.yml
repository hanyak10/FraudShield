server:
  port: 8761

spring:
  application:
    name: fraudshield-eureka-server

# A Eureka server should NOT register with itself or fetch the registry.
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # Disable self-preservation in dev so dead instances are evicted quickly.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
